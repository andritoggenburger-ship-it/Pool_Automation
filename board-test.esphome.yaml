# Minimal smoke-test firmware for the new ESP32-WROOM-32U board.
# No sensor wiring required - just power the board over USB and flash this.
# Confirms: board boots, connects to WiFi, and is reachable from Home Assistant / ESPHome.

esphome:
  name: board-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_2
      password: !secret wifi_password_2
  ap:
    ssid: !secret wifi_fallback_ssid
    password: !secret fallback_password_pond_node

captive_portal:

binary_sensor:
  - platform: status
    name: Board Test Status

sensor:
  - platform: wifi_signal
    name: Board Test WiFi RSSI
    update_interval: 30s

  - platform: uptime
    name: Board Test Uptime
    update_interval: 30s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: Board Test IP Address

button:
  - platform: restart
    name: Board Test Restart
